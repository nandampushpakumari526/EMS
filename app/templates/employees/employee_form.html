
{% extends "base.html" %}

{% block title %}Employee Form{% endblock %}

{% block content %}

<h2 class="page-title mb-4">
    {{ "Edit Employee" if employee else "Add Employee" }}
</h2>

<div class="card p-4">

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Employee Name
            </label>

            <input type="text"
                   name="name"
                   class="form-control"
                   value="{{ employee.name if employee else '' }}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   value="{{ employee.email if employee else '' }}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Role
            </label>

            <select name="role_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Role
                </option>

                {% for role in roles %}

                <option value="{{ role.id }}"
                    {% if employee and employee.role_id == role.id %}
                        selected
                    {% endif %}>

                    {{ role.name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Department
            </label>

            <input type="text"
                   name="department"
                   class="form-control"
                   value="{{ employee.department if employee else '' }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Experience (Years)
            </label>

            <input type="number"
                   name="experience"
                   class="form-control"
                   min="0"
                   value="{{ employee.experience if employee else 0 }}">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Save Employee
        </button>

        <a href="{{ url_for('employee_list') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
