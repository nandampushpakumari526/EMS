
{% extends "base.html" %}

{% block title %}Employee Form{% endblock %}

{% block content %}

<h2 class="page-title mb-4">
    {{ "Edit Employee" if employee else "Add Employee" }}
</h2>

<div class="card p-4">

    <form method="POST">

        <!-- Employee Code -->
        <div class="mb-3">

            <label class="form-label">
                Employee Code
            </label>

            <input
                type="text"
                name="employee_code"
                class="form-control"
                value="{{ employee.employee_code if employee else '' }}"
                required
            >

        </div>

        <!-- Employee Name -->
        <div class="mb-3">

            <label class="form-label">
                Employee Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ employee.name if employee else '' }}"
                required
            >

        </div>

        <!-- Email -->
        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ employee.email if employee else '' }}"
                required
            >

        </div>

        <!-- Role -->
        <div class="mb-3">

            <label class="form-label">
                Role
            </label>

            <select
                name="role_id"
                class="form-select"
                required
            >

                <option value="">
                    Select Role
                </option>

                {% for role in roles %}

                    <option
                        value="{{ role.id }}"
                        {% if employee and employee.role_id == role.id %}
                            selected
                        {% endif %}
                    >

                        {{ role.name }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <!-- Department -->
        <div class="mb-3">

            <label class="form-label">
                Department
            </label>

            <input
                type="text"
                name="department"
                class="form-control"
                value="{{ employee.department if employee else '' }}"
            >

        </div>

        <!-- Status -->
        <div class="mb-3">

            <label class="form-label">
                Status
            </label>

            <select
                name="status"
                class="form-select"
                required
            >

                <option
                    value="active"
                    {% if not employee or employee.status == "active" %}
                        selected
                    {% endif %}
                >
                    Active
                </option>

                <option
                    value="inactive"
                    {% if employee and employee.status == "inactive" %}
                        selected
                    {% endif %}
                >
                    Inactive
                </option>

            </select>

        </div>

        <!-- Buttons -->
        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Employee
        </button>

        <a
            href="{{ url_for('ui.employee_list') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
